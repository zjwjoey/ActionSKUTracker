# Action 西班牙站商品每日监测程序 — 全局配置
# 所有阈值集中在此，禁止在代码中散落硬编码。

site:
  base_url: https://www.action.com/es-es
  sitemap_url: https://www.action.com/es-es/product-sitemap.xml
  locale: es-ES
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36
  # 官网 17 个入口：15 个一级类目 + Nuevo(新品) + Promoción semanal(每周促销)
  # Nuevo/促销页是徽章检测的权威信号源：sku 出现在该页 = 徽章开启
  categories:
    vivienda: https://www.action.com/es-es/c/vivienda/
    cuidado-personal: https://www.action.com/es-es/c/cuidado-personal/
    moda: https://www.action.com/es-es/c/moda/
    bricolaje: https://www.action.com/es-es/c/bricolaje/
    cocina: https://www.action.com/es-es/c/cocina/
    hogar: https://www.action.com/es-es/c/hogar/
    comer-y-beber: https://www.action.com/es-es/c/comer-y-beber/
    hobby: https://www.action.com/es-es/c/hobby/
    juguetes: https://www.action.com/es-es/c/juguetes/
    oficina-y-papeleria: https://www.action.com/es-es/c/oficina-y-papeleria/
    multimedia: https://www.action.com/es-es/c/multimedia/
    jardin: https://www.action.com/es-es/c/jardin/
    mascotas: https://www.action.com/es-es/c/mascotas/
    viajes: https://www.action.com/es-es/c/viajes/
    articulos-deportivos: https://www.action.com/es-es/c/articulos-deportivos/
    # 专属徽章入口（不在商品类目里，但必须扫）
    nuevo: https://www.action.com/es-es/nuevo/
    promocion-semanal: https://www.action.com/es-es/promocion-semanal/

browser:
  # HEADFUL：旧 Node 脚本在另一台机器用有头模式跑通 CF；无头更易被识别限流
  headless: false
  # 固定的 Playwright profile：跨 run 自然保留正常浏览会话，不属于 staging，且由 .gitignore 排除。
  profile_dir: runtime/browser_profile/action_es
  timeout_ms: 45000
  challenge_reloads: 3
  challenge_sleep_ms: 800
  # 详情页遇到 Cloudflare challenge 时只做受控等待：第 2 分钟、第 4 分钟各刷新一次，
  # 到第 5 分钟仍未恢复则停止详情阶段，不继续撞击页面。列表页仍使用上面的短重试策略。
  detail_challenge_wait_seconds: 300
  detail_challenge_reload_at_seconds: [120, 240]
  # CF/访问限制后的冷却时间；详情补抓按用户要求至少等待 2 分钟。
  cooldown_seconds: 120
  degraded_recovery_successes: 3
  # 温和并行节奏（复刻旧脚本经验，避免被限流）
  sleep_ms: 2500
  # 会话 cookies 文件（可选，存在则加载，用于保持 consent/locale）
  # Optional run-local consent/session cookies.  Never point production config
  # at a developer profile or an external absolute path.
  cookies_path: runtime/browser_profile/cookies.json

paths:
  master: runtime/master/Action_Master.xlsx
  snapshots: runtime/snapshots
  staging: runtime/staging
  state: runtime/state
  dictionary: runtime/dictionary
  dictionary_baseline: data/dictionary
  review_queue: runtime/review_queue
  images: runtime/images
  exports: runtime/exports
  history_archive: runtime/exports/history_archive
  logs: runtime/logs
  backups: runtime/backups
  temp: runtime/temp
  # Review-derived cat2 -> primary cat1 hint. It only queues a Detail
  # verification; it never overwrites official breadcrumb facts by itself.
  category_primary_map: data/dictionary/category_primary_mapping.csv

export_history:
  # 4 月批次不属于当前上下架明细交付口径；原始来源仍保留供其他研究使用。
  exclude_dates:
    - "2026-04-05"
  # 已冻结的上下架明细列。其后的新批次（例如下一次周一）会自动追加，
  # 但中间未纳入交付口径的旧批次不会被意外带入。
  include_dates:
    - "2026-01-08"
    - "2026-06-28"
    - "2026-07-05"
    - "2026-07-12"
    - "2026-07-19"
    - "2026-07-26"
    - "2026-08-02"
    - "2026-08-10"
    - "2026-08-17"
    - "2026-08-24"
    - "2026-08-31"
    - "2026-09-07"
    - "2026-09-14"

storage:
  mode: SQLITE_PRIMARY
  db_path: runtime/db/action_tracker.db

images:
  enabled: false
  asset_root: runtime/images/assets
  staging_root: runtime/images/staging
  derivative_root: runtime/images/derivatives
  manifest_path: runtime/images/manifests/image_manifest.csv
  download_workers: 3
  timeout_seconds: 20
  max_retries: 3
  derivative_profiles:
    excel_250:
      width: 250
      height: 250
      background: white
      fit: contain
      format: png

# 字典构建的只读辅助证据；缺失时构建继续，但会在 manifest 中明确记录。
dictionary_sources:
  standardized_seed: runtime/exports/Action_Today_On_Sale_2026-08-24_中文标准化全量.xlsx
  historical_spanish_reference: runtime/temp/longterm_master_20260813/numeric_reference.csv
  historical_spanish_repair_reference: runtime/temp/longterm_master_20260813/numeric_reference_repaired.csv
  # Optional offline references are supplied explicitly by a caller; they are
  # intentionally unset in the repository configuration.
  historical_spanish_raw_root: null
  brand_reference: null
  term_seed: config/dictionary_terms.yaml

# ---- 生命周期（规范 §17）----
lifecycle:
  offline_confirmation_runs: 3
  max_detail_retries: 5

# ---- QA 阈值（规范 §42）----
qa:
  # Sitemap 已完整保存、但 Listing 后续不完整时，允许降级提交 Presence；
  # 不把该轮伪装为完整 Listing 扫描。
  allow_sitemap_presence_fallback: true
  max_active_drop_percent: 15
  max_active_increase_percent: 20
  max_new_sku_percent: 5
  max_missing_percent: 5
  max_sitemap_listing_gap_percent: 5
  price_min: 0.01
  price_max: 1000.0
  # 单日进入 REVIEW_QUEUE 的异常价格上限，超过判定为大规模异常
  max_anomaly_count: 20
  # SQLite 提交前禁止本地化字段覆盖率发生灾难性回退
  max_localization_coverage_drop: 0.5

# ---- 运行策略 ----
run:
  lock_stale_minutes: 180
  # 详情抓取后多久需要强制刷新（天）
  detail_refresh_days: 7
  # 单轮详情页最大请求数。生产默认保守限量；需要扩大范围时必须显式
  # 通过配置/命令行授权，超额候选进入 detail_backlog.csv。
  max_detail_per_run: 20
  # 翻译：阶段一不做（中文列用西语 fallback 占位）。
  # 后续启用时走 AI API（见下方 ai 段），不用外部翻译服务。
  translation_enabled: false
  image_download_enabled: false
  # dry-run 时是否对新品/变化 SKU 抓详情
  dry_run_fetch_details: true

# 字典 Apply Gate：实现了正式门禁，但生产写入仍明确关闭。
# 只有未来经过独立授权、审计和回归验证后才可改为 true。
dictionary_apply:
  production_enabled: false
  # PRODUCT_DICTIONARY_REFERENCE/未完成人工确认的品牌只能按显式策略作为临时候选；
  # UNKNOWN 品牌仍然不能 AUTO_READY。
  allow_provisional_brands: true
  # 即使导出/覆盖率暂时允许临时品牌，正式回填默认仍要求品牌已确认。
  require_confirmed_brands_for_apply: true

# ---- Knowledge Production V1（P3-P6）----
# Contracts and offline preview may be used during development; production
# localization writes and model/auto-approval paths stay explicitly closed.
knowledge:
  production_apply_enabled: true
  fallback_to_spanish: true

# Temporary explicit authorization for the reviewed registry Apply.
localization:
  production_apply_enabled: true
  auto_approval_enabled: false

scoped_dictionary:
  enabled: false

translation:
  ai_enabled: false
  provider: null
  model: null
  max_batch_size: 20
  max_retries: 3
  auto_approval_enabled: false
  auto_approval_policy: auto_approval_v1

# ---- AI（预留）：后续翻译用 AI API 配置，不接外部翻译服务 ----
# 密钥不落盘：运行时从环境变量 ACTION_AI_API_KEY 读取
ai:
  translation_provider: ""   # 例如 openai / anthropic / deepseek
  model: ""                  # 例如 claude-haiku-4-5-20251001
  # 定时任务：已取消（不做）
