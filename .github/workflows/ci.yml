name: CI

on:
  push:
    paths-ignore:
      - "runtime/**"
      - "outputs/**"
      - "reports/**"
      - "assets/**"
  pull_request:
    paths-ignore:
      - "runtime/**"
      - "outputs/**"
      - "reports/**"
      - "assets/**"

permissions:
  contents: read

jobs:
  test:
    name: CI-safe tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run CI-safe tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import pytest

          test_files = [
              line.strip()
              for line in Path("tests/ci_safe_tests.txt").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          raise SystemExit(pytest.main(["-q", *test_files]))
          PY
